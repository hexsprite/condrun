[package]
name = "condrun"
version = "0.1.0"
edition = "2024"
description = "Conditional command runner. Gates execution on system state predicates (wifi SSID, low-data-mode, AC power, interface type) and kills the child if predicates flip mid-run."
license = "MIT OR Apache-2.0"
repository = "https://github.com/hexsprite/condrun"
keywords = ["cli", "supervisor", "network", "wifi", "predicate"]
categories = ["command-line-utilities"]
exclude = ["AGENTS.md", "CLAUDE.md", ".claude", ".github", "docs"]

[lib]
name = "condrun"
path = "src/lib.rs"

[[bin]]
name = "condrun"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "sync"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
objc2 = "0.5"
objc2-foundation = "0.3"
block2 = "0.5"

[features]
test-fixture = []
platform-tests = []

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "process", "signal", "time", "sync"] }
tokio-test = "0.4"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
pretty_assertions = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
