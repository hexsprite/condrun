name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Build (default features)
        run: cargo build --release

      - name: Unit tests (default features)
        run: cargo nextest run --lib

      - name: Unit + integration tests (test-fixture feature)
        run: cargo nextest run --features test-fixture --test-threads=1

      - name: Coverage (test-fixture feature)
        run: cargo llvm-cov --features test-fixture nextest --test-threads=1 --lcov --output-path lcov.info

      - name: Upload coverage to Codecov (optional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
